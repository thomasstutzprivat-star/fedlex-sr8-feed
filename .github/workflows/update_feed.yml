name: Update Fedlex SR8 RSS Feed

on:
  schedule:
    # Führt das Skript täglich um 06:00 UTC (07:00 / 08:00 Schweizer Zeit) aus
    - cron: '0 6 * * *'
  workflow_dispatch: # Ermöglicht manuelles Starten per Klick

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Feed
        run: python generate_feed.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sr8_feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update SR8 RSS feed" && git push)
